[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lumenfetch"
version = "2.0.0"
description = "YouTube downloader buat terminal - MP4 & MP3."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Nicolas Dwi Dharma" }]
keywords = ["youtube", "downloader", "mp4", "mp3", "yt-dlp", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Utilities",
]
dependencies = [
    "yt-dlp",
    "rich",
    # Wajib untuk lolos bot-check YouTube (TLS impersonation).
    "curl_cffi",
    # Opsional tapi direkomendasikan (degraded gracefully kalau absen):
    # - pyperclip: auto-paste clipboard
    # - static-ffmpeg: ffmpeg bundled (merge MP4 & ekstrak MP3)
    "pyperclip",
    "static-ffmpeg",
]

[project.scripts]
lumenfetch = "main:cli"

[project.optional-dependencies]
dev = ["pytest", "ruff", "pyinstaller"]

[project.urls]
Homepage = "https://github.com/nekonaru/lumenfetch"

[tool.hatch.build]
# main.py modul top-level: ikutkan ke wheel agar console script jalan.
force-include = { "main.py" = "main.py" }

[tool.hatch.build.targets.wheel]
packages = ["core"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
