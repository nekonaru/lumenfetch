[project]
name = "lumenfetch"
version = "2.0.0"
description = "YouTube downloader buat terminal - MP4 & MP3."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "yt-dlp",
    "rich",
    # Wajib untuk lolos bot-check YouTube (TLS impersonation).
    "curl_cffi",
    # Opsional tapi direkomendasikan (degraded gracefully kalau absen):
    # - pyperclip: auto-paste clipboard
    # - static-ffmpeg: ffmpeg bundled (merge MP4 & ekstrak MP3)
    "pyperclip",
    "static-ffmpeg",
]

[project.scripts]
lumenfetch = "main:main"

[project.optional-dependencies]
dev = ["pytest", "ruff", "pyinstaller"]

[project.urls]
Homepage = "https://github.com/nekonaru/lumenfetch"

[tool.hatch.build.targets.wheel]
packages = ["core"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
