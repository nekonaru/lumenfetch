name: Publish

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: write

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows exe
        run: pyinstaller --onefile --console --name lumenfetch main.py

      - name: Smoke test exe
        run: ./dist/lumenfetch.exe --version

      - name: Attach exe to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/lumenfetch.exe

  publish-pypi:
    needs: build-exe
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build package
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI (trusted publishing, no token needed)
        uses: pypa/gh-action-pypi-publish@release/v1
